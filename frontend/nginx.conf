events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip         on;
    gzip_vary    on;
    gzip_proxied any;
    gzip_types   text/plain text/css application/javascript application/json
                 application/x-javascript text/xml application/xml image/svg+xml;

    # ── HTTP (puerto 80) ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── API REST ─────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Webhooks de Evolution API ─────────────────────────────────────────
        location /webhook/ {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── WebSocket (SockJS + WS) ───────────────────────────────────────────
        location /ws {
            proxy_pass          http://backend:8080;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_read_timeout  3600s;
        }

        # ── Imágenes subidas (servidas por backend) ───────────────────────────
        location /uploads/ {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Angular SPA (HTML5 routing) ───────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── HTTPS (puerto 443) — activo solo si existen certs de Let's Encrypt ───
    # Para habilitar HTTPS:
    #   1. Instala certbot en el droplet: sudo apt install certbot
    #   2. Obtén el cert:  sudo certbot certonly --standalone -d tudominio.com
    #   3. Descomenta el bloque de abajo y reemplaza tudominio.com
    #   4. docker compose restart frontend

