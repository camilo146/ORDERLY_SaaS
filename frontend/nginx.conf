events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Oculta la versión de nginx del header Server
    server_tokens off;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # ── Zonas de rate limiting por IP (en memoria compartida) ───────────────
    # auth_limit: 10 req/min — auth endpoints (login, register, forgot-password...)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    # api_limit: 300 req/min — endpoints API generales
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;

    gzip         on;
    gzip_vary    on;
    gzip_proxied any;
    gzip_types   text/plain text/css application/javascript application/json
                 application/x-javascript text/xml application/xml image/svg+xml;

    # ── HTTP → HTTPS redirect (dominio nombrado) ────────────────────────────
    server {
        listen 80;
        server_name orderlymyapp.com www.orderlymyapp.com;

        # HSTS preemptivo también en redirect para clientes HSTS-aware
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        return 301 https://orderlymyapp.com$request_uri;
    }

    # ── HTTP fallback (IP directa / host desconocido) ───────────────────────
    # Solo sirve archivos estáticos. La API, webhooks y WS se bloquean o
    # redirigen a HTTPS para evitar que JWT viaje sobre texto plano.
    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        root  /usr/share/nginx/html;
        index index.html;

        # Bloquear acceso API/webhook/WS sin TLS
        location /api/     { return 301 https://orderlymyapp.com$request_uri; }
        location /webhook/ { return 444; }
        location /ws       { return 444; }
        location /uploads/ { return 444; }
        location /         { try_files $uri $uri/ /index.html; }
    }

    # ── HTTPS (puerto 443) ──────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name orderlymyapp.com www.orderlymyapp.com;

        ssl_certificate     /etc/letsencrypt/live/orderlymyapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orderlymyapp.com/privkey.pem;

        # TLS moderno: solo TLS 1.2/1.3, ciphers ECDHE preferidas (PFS)
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;  # TLS 1.3 elige el cipher óptimo
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;   # Deshabilitado para Forward Secrecy

        # OCSP Stapling — reduce latencia TLS y mejora privacidad del cliente
        ssl_stapling        on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/orderlymyapp.com/chain.pem;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # www → apex redirect
        if ($host = www.orderlymyapp.com) {
            return 301 https://orderlymyapp.com$request_uri;
        }

        root  /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ───────────────────────────────────────────────
        # NOTA: add_header en el bloque server se hereda a los location que
        # no definan sus propios add_header. Ningún bloque location abajo
        # usa add_header para no romper la herencia.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # CSP: solo wss: en connect-src (no ws: en producción HTTPS)
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # ── Auth endpoints: rate limiting estricto ─────────────────────────
        # burst=10 nodelay: permite picos de 10 req seguidas, luego 10/min
        location /api/v1/auth/ {
            limit_req        zone=auth_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 30s;
            proxy_hide_header  X-Powered-By;
            client_max_body_size 1M;
        }

        # ── API general ────────────────────────────────────────────────────
        location /api/ {
            limit_req        zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://backend:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            proxy_hide_header  X-Powered-By;
        }

        # ── Webhooks (WhatsApp via Evolution API + Stripe) ─────────────────
        location /webhook/ {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_hide_header  X-Powered-By;
        }

        # ── WebSocket (notificaciones en tiempo real) ──────────────────────
        location /ws {
            proxy_pass          http://backend:8080;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;
        }

        # ── Archivos subidos (imágenes de productos) ───────────────────────
        location /uploads/ {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header  X-Powered-By;
        }

        # ── Angular SPA (catch-all) ────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
