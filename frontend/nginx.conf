events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip         on;
    gzip_vary    on;
    gzip_proxied any;
    gzip_types   text/plain text/css application/javascript application/json
                 application/x-javascript text/xml application/xml image/svg+xml;

    # ── HTTP → redirige a HTTPS ──────────────────────────────────────────────
    server {
        listen 80;
        server_name orderlymyapp.com www.orderlymyapp.com;
        return 301 https://orderlymyapp.com$request_uri;
    }

    # ── HTTP fallback (IP directa / otros hosts) ─────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        location /api/     { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 60s; }
        location /webhook/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /ws       { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
        location /uploads/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location /         { try_files $uri $uri/ /index.html; }
    }

    # ── HTTPS (puerto 443) ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name orderlymyapp.com www.orderlymyapp.com;

        ssl_certificate     /etc/letsencrypt/live/orderlymyapp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orderlymyapp.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # www → sin www
        if ($host = www.orderlymyapp.com) {
            return 301 https://orderlymyapp.com$request_uri;
        }

        root  /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /webhook/ {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /ws {
            proxy_pass          http://backend:8080;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_read_timeout  3600s;
        }

        location /uploads/ {
            proxy_pass         http://backend:8080;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
